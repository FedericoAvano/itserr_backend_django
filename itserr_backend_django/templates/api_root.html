{% extends "rest_framework/api.html" %}
{% load static %}

{% block content %}
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f4f4f4;
        color: #222;
        padding: 40px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        padding: 40px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }
    
    .logo {
        max-width: 150px;
        margin-bottom: 20px;
    }
    
    h1 {
        color: #800020;
        font-weight: 700;
        margin-bottom: 10px;
    }
    
    p {
        font-size: 1.1em;
        color: #666;
        margin-bottom: 30px;
    }

    ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    li a {
        display: inline-block;
        background-color: #800020;
        color: #fff;
        padding: 15px 30px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: background-color 0.3s ease, transform 0.2s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        width: 100%;
        box-sizing: border-box;
    }
    
    li a:hover {
        background-color: #5d0015;
        transform: translateY(-2px);
    }
</style>

<div class="container">
    <img src="{% static 'logo/your-logo-here.png' %}" alt="Logo" class="logo">
    <h1>ITSERR API</h1>
    <p>Benvenuto nell'API di gestione dei reperti.</p>

    <ul>
        {% for name, url in urls %}
            <li>
                <a href="{{ url }}">{{ name }}</a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
